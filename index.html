<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Asistente · BordaLink</title>
<meta name="theme-color" content="#0a0820">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="asistente-192.png">
<link rel="apple-touch-icon" href="asistente-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0820;color:#ece9ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 70% at 50% 0%,#2a1466 0%,#0a0820 60%),#0a0820;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
header img{width:30px;height:32px;object-fit:contain;border-radius:6px;background:#fff}
.ttl{text-transform:uppercase;font-weight:900;letter-spacing:3px;font-size:18px;line-height:1}
.ttl small{display:block;font-size:10px;letter-spacing:1.5px;font-weight:600;color:#a99cf0;margin-top:2px}
.chip{margin-left:auto;font-size:11px;padding:5px 10px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff1c;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:#777}
.chip.ok i{background:#22c55e}.chip.warn i{background:#f59e0b}.chip.err i{background:#ef4444}
.ic{background:#ffffff10;border:1px solid #ffffff1c;border-radius:12px;width:38px;height:38px;font-size:17px}
#hero{display:flex;flex-direction:column;align-items:center;padding:8px 16px 4px}
#orb{position:relative;width:150px;height:150px;border-radius:50%;border:0;background:none;cursor:pointer;transition:transform .3s}
#orb .core{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7dd3fc,#6d28d9 55%,#2e1065);box-shadow:0 0 50px #7c3aed99,inset 0 0 30px #0006;transition:all .4s}
#orb .r{position:absolute;inset:6px;border-radius:50%;border:2px solid #a78bfa55}
#orb .r2{inset:-4px;border:2px dashed #38bdf833;animation:gira 18s linear infinite}
#orb.fondo .core{box-shadow:0 0 40px #38bdf866,inset 0 0 30px #0006}
#orb.fondo .r{animation:late 3s ease-in-out infinite}
#orb.charla .core{background:radial-gradient(circle at 35% 30%,#a7f3d0,#0ea5e9 50%,#1e1b4b);box-shadow:0 0 70px #22d3eeaa}
#orb.charla .r{animation:late 1s ease-in-out infinite;border-color:#67e8f9aa}
#orb.piensa .core{animation:piensa 1.2s ease-in-out infinite}
#orb.piensa .r2{animation:gira 1.5s linear infinite;border-color:#c4b5fd99}
#orb.habla .core{animation:habla .5s ease-in-out infinite alternate;background:radial-gradient(circle at 35% 30%,#fbcfe8,#c026d3 50%,#3b0764);box-shadow:0 0 70px #e879f9aa}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes late{50%{transform:scale(1.08);opacity:.5}}
@keyframes piensa{50%{transform:scale(.9);filter:hue-rotate(40deg)}}
@keyframes habla{to{transform:scale(1.07)}}
#st{margin-top:8px;font-weight:700;font-size:15px;text-align:center;min-height:20px}
#vivo{font-size:13px;color:#a5f3fc;min-height:18px;text-align:center;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tgs{display:flex;gap:8px;padding:6px 16px}
.tg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:14px;background:#ffffff0c;border:1px solid #ffffff1a;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.tg input{display:none}
.tg.on{background:linear-gradient(135deg,#6d28d955,#0ea5e955);border-color:#a78bfa}
.tabs{display:flex;margin:6px 16px 0;background:#ffffff0c;border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;font-size:13px;color:#b8b0e8}
.tabs button.on{background:#7c3aed;color:#fff}
.tabs b{background:#ef4444;color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:3px}
.tabs b:empty{display:none}
main{flex:1;overflow:auto;padding:10px 16px}
.tab{display:none}.tab.on{display:block}
.m{max-width:85%;padding:9px 13px;border-radius:16px;margin:6px 0;font-size:14px;line-height:1.4;width:fit-content}
.m.u{margin-left:auto;background:#7c3aed;border-bottom-right-radius:4px}
.m.j{background:#ffffff12;border-bottom-left-radius:4px}
.m.a{background:#0ea5e922;border:1px solid #38bdf855;border-bottom-left-radius:4px}
.m small{display:block;font-size:10px;opacity:.55;margin-top:3px}
.vacio{color:#8f86c4;font-size:13px;text-align:center;padding:24px 10px;line-height:1.5}
.add{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.add input{flex:1;min-width:0;background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:10px;outline:0}
#p-txt{flex:1 1 100%}.add input[type=datetime-local]{flex:1;color-scheme:dark}
.add button,.bt{background:#7c3aed;border:0;border-radius:12px;padding:0 16px;font-weight:800;font-size:18px;min-height:42px}
.it{display:flex;align-items:flex-start;gap:10px;padding:11px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff14;margin-bottom:7px}
.it input[type=checkbox]{width:22px;height:22px;accent-color:#7c3aed;margin-top:1px;flex:0 0 auto}
.it .tx{flex:1;font-size:14px}
.it .tx small{display:block;color:#a99cf0;font-size:12px;margin-top:2px}
.it .tx small.tarde{color:#f87171}
.it.ok .tx{opacity:.45;text-decoration:line-through}
.it .x{background:none;border:0;color:#8f86c4;font-size:16px;padding:0 4px}
.tag{font-size:10px;background:#0ea5e933;color:#7dd3fc;border-radius:6px;padding:1px 5px;margin-left:4px}
.lnkb{display:block;margin:6px auto 12px;background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px}
footer{display:flex;gap:8px;padding:8px 16px 12px}
footer input{flex:1;background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:12px 14px;outline:0}
footer button{background:#7c3aed;border:0;border-radius:16px;width:48px;font-size:18px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.card{background:#151030;border:1px solid #ffffff1f;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.card h2{font-size:19px;margin-bottom:4px}
.card p.s{color:#a99cf0;font-size:13px;margin-bottom:12px;line-height:1.45}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;font-weight:700;color:#c4bbf5;margin-bottom:5px}
.f input,.f select{width:100%;background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:11px;outline:0}
.f select option{background:#151030}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #ffffff12;font-size:14px}
.rw input[type=checkbox]{width:22px;height:22px;accent-color:#7c3aed}
.btm{width:100%;background:linear-gradient(135deg,#7c3aed,#2563eb);border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;margin-top:6px}
.btg{width:100%;background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:12px;font-weight:700;margin-top:8px}
.nota{font-size:12px;color:#9f96d6;line-height:1.45;background:#ffffff08;border-radius:12px;padding:10px;margin-top:10px}
#ini{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 70% at 50% 20%,#2a1466,#0a0820 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
#ini img{width:150px;height:150px}
#ini h1{text-transform:uppercase;letter-spacing:6px;font-size:30px}
#ini p{color:#b8b0e8;font-size:14px;max-width:320px;line-height:1.5}
#ini button{background:linear-gradient(135deg,#7c3aed,#2563eb);border:0;border-radius:99px;padding:15px 34px;font-weight:800;font-size:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid #ffffff22;padding:10px 16px;border-radius:12px;font-size:13px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

  else if(x.tipo==='hecho'){const t=J.tareas.find(t=>t.id===x.id);if(t){t.hecha=true;t.hechaEn=Date.now()}}
  else if(x.tipo==='borrar')J.tareas=J.tareas.filter(t=>t.id!==x.id);
  else if(x.tipo==='mover'){const t=J.tareas.find(t=>t.id===x.id);if(t){t.fecha=validaF(x.fecha);t.av={}}}
  else if(x.tipo==='nota'&&x.texto)J.notas.push({id:nid('n'),texto:x.texto.trim(),creada:Date.now()});
  else if(x.tipo==='olvidar')J.notas=J.notas.filter(n=>n.id!==x.id)}catch(e){}})}
async function preguntar(txt){if(!LS.get('bl-jv-key')){ajustes();toast('Primero pega tu clave de Gemini');return}
  J.hist.push({r:'u',t:txt,ts:Date.now()});pintar();pensando=true;recAjustar();estado('Pensando…');
  const cont=J.hist.filter(h=>h.r!=='a').slice(-16).map(h=>({role:h.r==='u'?'user':'model',parts:[{text:h.t}]}));
  let out;try{out=await gemini(sistema(),cont,ESQ)}catch(e){out={decir:e.dime||'No me pude conectar. Revisa el internet.'}}
  pensando=false;ejecutar(out.acciones);
  const say=String(out.decir||'Listo.').replace(/[*#_`]/g,'').trim();
  J.hist.push({r:'j',t:say,ts:Date.now()});J.hist=J.hist.slice(-60);guardar();
  const fin=/\b(gracias|adi[oó]s|hasta luego|es todo|nada m[aá]s|eso es todo)\b/i.test(txt);
  decir(say,()=>{if(!fin&&!off('jv-conv'))charla(8)})}

/* ---------- Modo Guardián ---------- */
let buf=[],bufT=0;
function escuchado(t){buf.push(t);if(!bufT)bufT=Date.now();if(buf.join(' ').length>800)procesar()}
async function procesar(){const txt=buf.join(' ');buf=[];bufT=0;if(txt.split(/\s+/).length<6||!LS.get('bl-jv-key'))return;
  const sys='Analizas lo que escuchó el teléfono de '+(dueno()||'el dueño')+' en su taller de bordado. AHORA: '+iso()+', hora de la Ciudad de México. Detecta SOLO compromisos concretos que el dueño tiene que hacer (enviar, entregar, llamar, pagar, comprar, recoger, cotizar, mandar mensaje), con o sin hora. Ignora plática general, chismes, groserías y lo que hagan otras personas si no le toca al dueño. No repitas estos que ya existen: '+(J.tareas.filter(t=>!t.hecha).map(t=>t.texto).join('; ')||'ninguno')+'. Si no hay nada, lista vacía. texto: verbo en infinitivo + qué, corto. fecha: AAAA-MM-DDTHH:MM o vacía.';
  const esq={type:'OBJECT',properties:{pendientes:{type:'ARRAY',items:{type:'OBJECT',properties:{texto:{type:'STRING'},fecha:{type:'STRING'}},required:['texto']}}},required:['pendientes']};
  try{const o=await gemini(sys,[{role:'user',parts:[{text:'Lo que se escuchó: '+txt}]}],esq);const ps=(o.pendientes||[]).filter(p=>p.texto);
    if(!ps.length)return;ps.forEach(p=>J.tareas.push({id:nid('t'),texto:p.texto.trim(),fecha:validaF(p.fecha),creada:Date.now(),hecha:false,origen:'oído',av:{}}));
    anunciar(ps.length===1?'Anoté algo que escuché: '+minus(ps[0].texto)+(ps[0].fecha?', para '+bonita(validaF(ps[0].fecha)):'')+'.':'Anoté '+ps.length+' pendientes que escuché. Revísalos en la lista.')}catch(e){}}

/* ---------- recordatorios y resumen ---------- */
function revisar(){const now=Date.now();let ch=false;
  J.tareas.forEach(t=>{if(t.hecha||!t.fecha)return;const due=new Date(t.fecha).getTime();if(isNaN(due))return;t.av=t.av||{};
    const lead=due-t.creada>45*60000?30*60000:0;
    if(lead&&!t.av.pre&&now>=due-lead&&now<due){t.av.pre=1;ch=true;anunciar('Te recuerdo: en media hora tienes que '+minus(t.texto)+'.')}
    else if(!t.av.at&&now>=due&&now<due+3*3600000){t.av.at=1;t.av.n=1;t.av.ult=now;ch=true;anunciar('Ya es hora: '+minus(t.texto)+'.')}
    else if(t.av.at&&t.av.n<4&&now-t.av.ult>=30*60000&&now<due+6*3600000){t.av.n++;t.av.ult=now;ch=true;anunciar('Sigue pendiente: '+minus(t.texto)+'. Cuando lo hagas, dime "ya lo hice".')}});
  if(buf.length&&Date.now()-bufT>150000)procesar();
  const hoy=new Date().toDateString(),h=new Date().getHours(),hb=+(LS.get('jv-brief-h')||8);
  if(!off('jv-brief')&&J.brief!==hoy&&h>=hb&&h<hb+4){J.brief=hoy;ch=true;resumen()}
  if(ch)guardar();else pintaPend()}
function resumen(){const ah=new Date(),p=J.tareas.filter(t=>!t.hecha),dia=f=>new Date(f).toDateString()===ah.toDateString();
  const hoyT=p.filter(t=>t.fecha&&dia(t.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1),atr=p.filter(t=>t.fecha&&new Date(t.fecha)<ah&&!dia(t.fecha)),sin=p.filter(t=>!t.fecha);
  let s=(ah.getHours()<12?'Buenos días':ah.getHours()<19?'Buenas tardes':'Buenas noches')+(dueno()?' '+dueno():'')+'. ';
  if(!p.length)s+='No tienes pendientes anotados. ';
  else{if(hoyT.length)s+='Hoy tienes '+(hoyT.length===1?'un pendiente: ':hoyT.length+' pendientes: ')+hoyT.slice(0,4).map(t=>minus(t.texto)+' a las '+hora(t.fecha)).join('; ')+'. ';
    if(atr.length)s+='Se te quedaron '+(atr.length===1?'uno':atr.length)+' de días pasados, como '+minus(atr[0].texto)+'. ';
    if(sin.length)s+='Y '+(sin.length===1?'uno':sin.length)+' sin hora. '}
  const cola=COLA.filter(c=>c.estado!=='terminado').length;if(cola)s+='En la cola de producción hay '+(cola===1?'un trabajo.':cola+' trabajos.');
  anunciar(s.trim())}

/* ---------- pantalla ---------- */
function pintar(){pintaLog();pintaPend();pintaMem()}
function pintaLog(){const lg=$('#log');const h=J.hist.slice(-40);
  lg.innerHTML=h.length?h.map(x=>'<div class="m '+x.r+'">'+esc(x.t)+'<small>'+new Date(x.ts).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'})+'</small></div>').join(''):'<div class="vacio">Dime "'+AIN()+', recuérdame a las 6 mandar el pedido del colegio" o pregúntame por tus pedidos y máquinas.</div>';
  const mn=$('main');if($('#tab-charla').classList.contains('on'))mn.scrollTop=mn.scrollHeight}
function pintaPend(){const ah=Date.now(),pend=J.tareas.filter(t=>!t.hecha).sort((a,b)=>(a.fecha||'9')<(b.fecha||'9')?-1:1),hech=J.tareas.filter(t=>t.hecha).sort((a,b)=>(b.hechaEn||0)-(a.hechaEn||0)).slice(0,8);
  $('#n-pend').textContent=pend.length||'';
  const row=t=>'<div class="it '+(t.hecha?'ok':'')+'" data-id="'+t.id+'"><input type="checkbox" '+(t.hecha?'checked':'')+'><div class="tx">'+esc(t.texto)+(t.origen==='oído'?'<span class="tag">👂 escuchado</span>':'')+(t.fecha?'<small class="'+(!t.hecha&&new Date(t.fecha)<ah?'tarde':'')+'">⏰ '+bonita(t.fecha)+'</small>':'<small>Sin hora</small>')+'</div><button class="x" title="Borrar">✕</button></div>';
  $('#plist').innerHTML=(pend.length?pend.map(row).join(''):'<div class="vacio">Sin pendientes. Díctale uno a '+AIN()+' o escríbelo arriba.</div>')+(hech.length?'<div class="vacio" style="padding:10px">Hechos</div>'+hech.map(row).join(''):'')}
function pintaMem(){$('#mlist').innerHTML=J.notas.length?J.notas.slice().reverse().map(n=>'<div class="it" data-nid="'+n.id+'"><div class="tx">'+esc(n.texto)+'<small>'+new Date(n.creada).toLocaleDateString('es-MX',{day:'numeric',month:'short'})+'</small></div><button class="x">✕</button></div>').join(''):'<div class="vacio">Aquí guarda '+AIN()+' lo que le pides recordar: "'+AIN()+', recuerda que el cliente del colegio quiere el logo en hilo dorado".</div>'}
function pintaTg(){$('#t-fondo').checked=on('jv-fondo');$('#t-angel').checked=on('jv-angel');$('#tg-fondo').classList.toggle('on',on('jv-fondo'));$('#tg-angel').classList.toggle('on',on('jv-angel'));despierto()}
let wl=null;async function despierto(){try{if(on('jv-fondo')&&'wakeLock' in navigator&&document.visibilityState==='visible'){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}else if(wl){wl.release();wl=null}}catch(e){}}

/* ---------- hojas: ajustes, login, ángel ---------- */
function hoja(h){$('#card').innerHTML=h;$('#sheet').classList.add('on')}
function cerrar(){$('#sheet').classList.remove('on')}
function ajustes(){const k=LS.get('bl-jv-key')||'',s=ses(),vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  hoja('<h2>⚙️ Ajustes de '+AIN()+'</h2><p class="s">'+AIN()+' piensa con Gemini de Google. La clave y tus datos se guardan solo en tus aparatos y en tu nube.</p>'
  +'<div class="f"><label>Clave de Gemini (Google AI Studio)</label><input id="a-key" type="password" value="'+esc(k)+'" placeholder="Pega tu clave"></div>'
  +'<div class="f"><label>Voz</label><select id="a-modo"><option value="real" '+(modoVoz()==='real'?'selected':'')+'>Realista (Gemini, suena humana)</option><option value="dev" '+(modoVoz()==='dev'?'selected':'')+'>Del teléfono (gratis, sin límite)</option></select></div>'
  +'<div class="f" id="a-gv" style="'+(modoVoz()==='real'?'':'display:none')+'"><label>Voz realista</label><select id="a-gvoz">'+VOCES.map(v=>'<option value="'+v[0]+'" '+((LS.get('bl-jv-gvoz')||'Charon')===v[0]?'selected':'')+'>'+v[1]+'</option>').join('')+'</select></div>'
  +'<div class="f" id="a-dv" style="'+(modoVoz()==='dev'?'':'display:none')+'"><label>Voz del teléfono</label><select id="a-dvoz"><option value="">Automática</option>'+vs.map(v=>'<option value="'+esc(v.voiceURI)+'" '+(LS.get('bl-jv-dvoz')===v.voiceURI?'selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select></div>'
  +'<button class="btg" id="a-nom">✏️ Nombre del asistente: '+esc(AIN())+'</button>'+'<button class="btg" id="a-probar">🔊 Probar voz</button>'
  +'<div class="rw">Seguir la plática sin decir "'+AIN()+'"<input type="checkbox" id="a-conv" '+(off('jv-conv')?'':'checked')+'></div>'
  +'<div class="rw">Avisarme pedidos nuevos y máquinas paradas<input type="checkbox" id="a-av" '+(off('jv-avisos')?'':'checked')+'></div>'
  +'<div class="rw">Resumen del día a las <select id="a-bh" style="width:auto;background:#ffffff10;border:1px solid #ffffff22;border-radius:10px;padding:6px">'+[6,7,8,9,10].map(h=>'<option '+((+(LS.get('jv-brief-h')||8))===h?'selected':'')+'>'+h+'</option>').join('')+'</select><input type="checkbox" id="a-brief" '+(off('jv-brief')?'':'checked')+'></div>'
  +'<button class="btg" id="a-notif">🔔 Permitir notificaciones</button>'
  +'<div class="rw">Nube<span style="font-size:12px;color:#a99cf0">'+(s?esc(s.email||'conectada'):'sin conectar')+'</span></div>'
  +(s?'<button class="btg" id="a-salir">Cerrar sesión de la nube</button>':'<button class="btg" id="a-login">Conectar con mi cuenta BordaLink</button>')
  +'<button class="btm" id="a-ok">Guardar</button>'
  +'<div class="nota">💡 Para que te avise a tiempo, deja '+AIN()+' abierto. Con "Escuchar '+AIN()+'" activo la pantalla se queda prendida; conéctalo al cargador. Si el teléfono se bloquea, Android puede retrasar los avisos.</div>')}
function login(){hoja('<h2>☁️ Conecta tu cuenta</h2><p class="s">La misma de BordaLink. Así '+AIN()+' conoce tus pedidos y máquinas, y tus pendientes se ven en todos tus aparatos.</p>'
  +'<div class="f"><label>Correo</label><input id="l-mail" type="email" autocomplete="username"></div><div class="f"><label>Contraseña</label><input id="l-pw" type="password" autocomplete="current-password"></div>'
  +'<button class="btm" id="l-ok">Entrar</button><button class="btg" id="l-no">Usar sin nube por ahora</button>')}
function angelInfo(){hoja('<h2>🛡️ Modo Guardián</h2><p class="s">'+AIN()+' escucha lo que se platica cerca del teléfono y, si oye algo que tú tienes que hacer ("mándame la cotización a las 6"), te lo anota y te lo recuerda.</p>'
  +'<div class="nota">🔒 No graba audio ni guarda lo que escucha: solo se queda con los pendientes que detecta. El texto pasa por Gemini de Google para entenderlo.<br><br>⚖️ Úsalo en pláticas en las que tú participas. No lo dejes escuchando a otras personas sin que sepan; en el taller, avísales a tus trabajadores.</div>'
  +'<button class="btm" id="g-ok">Entendido, activar</button><button class="btg" data-x>Cancelar</button>')}

/* ---------- eventos ---------- */
$('#b-ini').onclick=async()=>{aCtx();try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}$('#ini').remove();
  siguePaso();
  pintaTg();recAjustar();jalar(true).then(()=>{if(!J.hist.length&&LS.get('bl-jv-key')&&LS.get('jv-ai')){const s='Hola'+(dueno()?' '+dueno():'')+', soy '+AIN()+'. Dime qué necesitas recordar o pregúntame por tu taller.';J.hist.push({r:'j',t:s,ts:Date.now()});guardar();decir(s)}revisar()})};
$('#orb').onclick=()=>{aCtx();if(hablando){parar();try{src&&src.stop()}catch(e){}return}if(enCharla()){charlaHasta=0;recAjustar();estado();return}charla(9)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+b.dataset.tab));if(b.dataset.tab==='charla')pintaLog()});
$('#t-fondo').onchange=e=>{aCtx();LS.set('jv-fondo',e.target.checked?'1':'0');if(!e.target.checked)LS.set('jv-angel','0');pintaTg();recAjustar();estado()};
$('#t-angel').onchange=e=>{e.target.checked=on('jv-angel');if(on('jv-angel')){LS.set('jv-angel','0');pintaTg();if(buf.length)procesar()}else angelInfo()};
const enviar=()=>{const i=$('#in'),v=i.value.trim();if(!v)return;i.value='';aCtx();charlaHasta=0;preguntar(v)};
$('#send').onclick=enviar;$('#in').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();enviar()}};
$('#p-add').onclick=()=>{const t=$('#p-txt').value.trim();if(!t)return;J.tareas.push({id:nid('t'),texto:t,fecha:validaF($('#p-fecha').value),creada:Date.now(),hecha:false,origen:'manual',av:{}});$('#p-txt').value='';$('#p-fecha').value='';guardar();toast('Pendiente anotado')};
$('#m-add').onclick=()=>{const t=$('#m-txt').value.trim();if(!t)return;J.notas.push({id:nid('n'),texto:t,creada:Date.now()});$('#m-txt').value='';guardar()};
$('#b-resumen').onclick=()=>{aCtx();resumen()};
$('#plist').onclick=e=>{const it=e.target.closest('.it');if(!it)return;const t=J.tareas.find(x=>x.id===it.dataset.id);if(!t)return;
  if(e.target.closest('.x')){J.tareas=J.tareas.filter(x=>x!==t);guardar();return}if(e.target.type==='checkbox'){t.hecha=e.target.checked;t.hechaEn=Date.now();guardar();if(t.hecha)toast('✅ ¡Bien! Marcado como hecho')}};
$('#mlist').onclick=e=>{const it=e.target.closest('.it');if(it&&e.target.closest('.x')){J.notas=J.notas.filter(n=>n.id!==it.dataset.nid);guardar()}};
$('#b-aj').onclick=ajustes;
$('#sheet').onclick=async e=>{const id=e.target.id;
  if(e.target===$('#sheet')||e.target.hasAttribute('data-x')){cerrar();return}
  if(id==='a-probar'){const k=$('#a-key').value.trim();if(k.length>=20)LS.set('bl-jv-key',k);LS.del('jv-tts-out');aCtx();decir('Hola, soy '+AIN()+'. Así sueno.')}
  if(id==='a-ok'){const k=$('#a-key').value.trim();if(k&&k.length<20){toast('Esa clave se ve incompleta');return}if(k)LS.set('bl-jv-key',k);LS.set('jv-brief-h',$('#a-bh').value);cerrar();toast('Guardado')}
  if(id==='a-notif'){if(!('Notification' in window)){toast('Este navegador no da notificaciones');return}const p=await Notification.requestPermission();toast(p==='granted'?'Listo, te avisaré con notificaciones':'No se dieron permisos')}
  if(id==='a-salir'){setSes(null);NEG=null;COLA=[];MAQ=[];nube('Sin nube');cerrar()}
  if(id==='a-login')login();
  if(e.target.dataset.sug){$('#n-ai').value=e.target.dataset.sug}
  if(id==='a-nom')nombrar();
  if(id==='n-ok'){const v=$('#n-ai').value.trim();if(v.length<2){toast('Escribe un nombre de al menos 2 letras');return}LS.set('jv-ai',v);pintaNombre();cerrar();toast('Listo, ahora me llamo '+v);if(!J.hist.length&&LS.get('bl-jv-key')){const s='Hola'+(dueno()?' '+dueno():'')+', soy '+v+'. Dime qué necesitas recordar o pregúntame por tu taller.';J.hist.push({r:'j',t:s,ts:Date.now()});guardar();decir(s)}siguePaso()}
  if(id==='l-no'){LS.set('jv-sin-nube','1');cerrar();siguePaso()}
  if(id==='l-ok'){const m=$('#l-mail').value.trim(),p=$('#l-pw').value;if(!m||!p){toast('Pon correo y contraseña');return}
    e.target.textContent='Entrando…';try{guardaSes(await auth('token?grant_type=password',{email:m,password:p}));cerrar();toast('Conectado a tu nube');tablaJ=true;await jalar(true);siguePaso()}catch(x){e.target.textContent='Entrar';toast('No se pudo entrar: '+x.message)}}
  if(id==='g-ok'){LS.set('jv-angel','1');LS.set('jv-fondo','1');cerrar();pintaTg();recAjustar();estado();toast('🛡️ Modo Guardián activo')}};
$('#sheet').onchange=e=>{const id=e.target.id,v=e.target.value,c=e.target.checked;
  if(id==='a-modo'){LS.set('bl-jv-modo',v);$('#a-gv').style.display=v==='real'?'':'none';$('#a-dv').style.display=v==='dev'?'':'none'}
  if(id==='a-gvoz')LS.set('bl-jv-gvoz',v);if(id==='a-dvoz')LS.set('bl-jv-dvoz',v);
  if(id==='a-conv')LS.set('jv-conv',c?'1':'0');if(id==='a-av')LS.set('jv-avisos',c?'1':'0');if(id==='a-brief')LS.set('jv-brief',c?'1':'0')};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){despierto();jalar();recAjustar()}});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
setInterval(revisar,15000);setInterval(()=>{if(ses())jalar()},30000);
pintaNombre();pintar();pintaTg();estado();
})();
</script>
